# E2: as E1 plus crop jitter (plan Step 6, D16). Only the aug block differs from e1.yaml.
batch_size: 16            # 8 if memory requires
warm_epochs: 3            # backbone frozen (weights and BatchNorm statistics), head only
finetune_epochs: 150       # D21 (was 50; D20 trial)
lr_head_warm: 0.001
lr_backbone: 0.0001
lr_head: 0.0005
milestones: [0.6, 0.85]   # x0.1 from fine-tune epochs floor(0.6 E) and floor(0.85 E)
seed: 230
num_workers: 4
val_every: 1
val_partition: val        # never test
val_batch_size: 32
expand: 1.25
sigma: 2.0
aug:
  flip_p: 0.5
  rot_deg: 15.0
  scale_range: [0.8, 1.2]
  jitter:                 # reference-box center +-10% of its width/height (per axis), size x0.9-1.1
    p: 1.0
    shift: 0.10
    scale_range: [0.9, 1.1]
